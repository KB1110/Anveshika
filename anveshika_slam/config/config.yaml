    rgb_topic_in: "/camera/rgb/image_raw"
    depth_topic_in: "/camera/depth/image_raw"
    camera_imu_topic_in: "/camera/imu"
    body_imu_topic_in: "/imu"
    lidar_topic_in: "/lidar/points"

    rgbd_topic_out: "/slam/rgbd/image"
    camera_imu_topic_out: "/slam/imu/cam"
