    lidar_topic_out: "/slam/lidar/points"

vio_node:
  ros__parameters:
    rgbd_topic_in: "/camera/rgb/image_raw"
    body_imu_topic_in: "/imu"
    lidar_topic_in: "/lidar/points"

    vio_odom_out: "slam/vio/odom"
